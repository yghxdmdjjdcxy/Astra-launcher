name: Deploy to thevibehosting.com

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VIBE_API_KEY: ${{ secrets.VIBE_API_KEY }}
  VIBE_SERVER_ID: ${{ secrets.VIBE_SERVER_ID }}
  VIBE_SSH_KEY: ${{ secrets.VIBE_SSH_KEY }}
  VIBE_SSH_HOST: ${{ secrets.VIBE_SSH_HOST }}
  VIBE_SSH_PORT: ${{ secrets.VIBE_SSH_PORT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p deploy-site
          cp -r site/* deploy-site/

      - name: Wake server via API
        run: |
          curl -sX POST -H "Authorization: Bearer $VIBE_API_KEY" \
            "https://thevibehosting.com/servers/$VIBE_SERVER_ID/wake" | jq .

      - name: Wait for server ready
        run: |
          for i in {1..30}; do
            STATE=$(curl -s -H "Authorization: Bearer $VIBE_API_KEY" \
              "https://thevibehosting.com/servers/$VIBE_SERVER_ID" | jq -r .state)
            echo "Server state: $STATE"
            [ "$STATE" = "running" ] && break
            sleep 2
          done

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VIBE_SSH_HOST }}
          port: ${{ env.VIBE_SSH_PORT }}
          username: root
          key: ${{ env.VIBE_SSH_KEY }}
          source: "deploy-site/*"
          target: "/root/www"
          strip_components: 1
          timeout: 60s

      - name: Verify deployment
        run: |
          sleep 3
          curl -sf "https://b7d020.thevibehosting.com" | grep -q "Astra Launcher" && echo "✅ Deployment verified" || (echo "❌ Verification failed" && exit 1)